<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SyllabusSync</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=asset_version('style.css')) }}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/" aria-label="SyllabusSync home">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M7 3v4M17 3v4M3 10h18M8 15l2.5 2.5L16 12"></path></svg>
            </span>
            <span>SyllabusSync</span>
        </a>
    </header>
    <main class="error-page">
        <section class="error-card" aria-labelledby="error-title">
            <div class="error-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6M12 12v4M12 19h.01"></path></svg>
            </div>
            <h1 class="error-title" id="error-title">We couldn't complete that.</h1>
            <p class="message">{{ text }}</p>
            <div class="error-actions">
                <a class="button" href="/">Paste the text instead</a>
                <a class="button button-secondary" href="/">Choose a different PDF</a>
            </div>
        </section>
    </main>
</body>
</html>
